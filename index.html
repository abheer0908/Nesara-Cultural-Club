  }
  .heading {
    text-align: center;
    background: #ff6f00;
    color: white;
    padding: 25px 20px;
    border-radius: 8px;
    margin-bottom: 25px;
    box-shadow: 0 3px 6px rgba(230, 81, 0, 0.2);
  }
  .heading h1 {
    margin: 0;
    font-size: 2.5rem;
  }
  .section {
    margin-bottom: 25px;
    padding: 25px 20px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
 
  .now-color { border-left: 6px solid #2e7d32; color: #2e7d32; }
  .upcoming-color { border-left: 6px solid #d32f2f; color: #d32f2f; }
  .future-color { border-left: 6px solid darkorange; color: darkorange; }
  .past-color { border-left: 6px solid #555555; color: #555555; } /* Darker grey for clear visibility */

  .section h2 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 2.0rem;
    letter-spacing: 0.5px;
  }
  .event-row {
    color: #000000;
    border-left: 4px solid #aaaaaa;
    padding: 20px 15px;
    margin: 15px 0 0 0;
    background: #fafafa;
    border-radius: 6px;
    font-size: 1.50rem;
    line-height: 1.45;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.02);
  }
</style>

        `;

  function displayDate(dateObj) {
    return dateObj.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  }

  function displayDay(dateObj) {
    return dateObj.toLocaleDateString('en-IN', { weekday: 'short' });
  }

  function displayTime(dateObj) {
    return dateObj.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true });
  }

  function updateDashboard() {
    const now = new Date();
    const upcomingCutoff = new Date(now.getTime() + (UPCOMING_WINDOW_MINUTES * 60 * 1000));

    let liveHtml = "";
    let upcomingHtml = "";
    let futureHtml = "";
    let pastHtml = "";
     
    const lines = rawSchedule.trim().split('\n');
    for (const line of lines) {
      if (!line.trim()) continue;

      const [startStr, endStr, name, venue] = line.split(';');
     
      const startTime = new Date(startStr);
      const endTime = new Date(endStr);

      const card = `
        <div class="event-row">
          <big><strong>Event: ${name}</strong></big><br>
          <strong>Date:</strong> ${displayDay(startTime)}, ${displayDate(startTime)}, <strong>Time:</strong> ${displayTime(startTime)} to ${displayTime(endTime)}<br>
          <strong>Venue:</strong> ${venue}<br>
        </div>
        `;

      if (now >= startTime && now <= endTime) {
        liveHtml += card;
      }
      else if (startTime > now && startTime <= upcomingCutoff) {
        upcomingHtml += card;
      }
      else if (startTime > upcomingCutoff) {
        futureHtml += card;
      }
      else if (now > endTime) {
        pastHtml += card;
      }
    }
     
    document.getElementById('live-events').innerHTML = liveHtml || "No events happening now.";
    document.getElementById('upcoming-events').innerHTML = upcomingHtml || "No upcoming events (in next 24 hours).";
    document.getElementById('future-events').innerHTML = futureHtml || "No future events scheduled.";
    document.getElementById('past-events').innerHTML = pastHtml || "No past events.";
    document.getElementById('clock').innerText = "⏱️ Current Time: " + now.toLocaleString('en-IN');
  }
   
  function refreshDashboard() {
    updateDashboard();
    setInterval(updateDashboard, 5000);
  }
</script>

<body class="full-page" onload="refreshDashboard();">
  <div class="heading">
    <h1>Nesara Cultural Club Events</h1>
    <div id="clock"></div>
  </div>

  <div class="section now-color">
    <h2>HAPPENING NOW</h2>
    <div id="live-events"></div>
  </div>

  <div class="section upcoming-color">
    <h2>UPCOMING EVENTS </h2>
    <div id="upcoming-events"></div>
  </div>

  <div class="section future-color">
    <h2>FUTURE EVENTS</h2>
    <div id="future-events"></div>
  </div>

  <div class="section past-color">
    <h2>PAST EVENTS</h2>
    <div id="past-events"></div>
  </div>
</body>
